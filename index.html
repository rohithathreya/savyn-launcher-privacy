<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Savyn — The anti-discipline OS</title>
    <meta name="description" content="The anti-discipline OS: your mind, your phone, your momentum.">
    <meta name="theme-color" content="#0c0a08">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>

<body class="home-lite">
    <div class="noise-overlay"></div>
    <div class="ambient-glow"></div>

    <nav class="top-nav container">
        <div class="nav-inner">
            <a href="/" class="logo">SAVYN</a>
            <div class="nav-links">
                <a href="#join-alpha" class="nav-link highlight-link">Join Alpha</a>
                <a href="/architecture/" class="nav-link">Architecture</a>
                <a href="/privacy/" class="nav-link">Privacy</a>
            </div>
        </div>
    </nav>

    <section class="hero hero-panel relative-z" id="hero">
        <div class="hero-backdrop" aria-hidden="true"></div>
        <div class="hero-inner container animate-fade-in">
            <div class="hero-copy">
                <h1 class="hero-title">
                    <span class="hero-cycler" aria-hidden="true">
                        <span class="hero-cycler-track" data-hero-cycler>
                            <span class="hero-cycler-item is-active">consume more</span>
                            <span class="hero-cycler-item">scroll more</span>
                            <span class="hero-cycler-item">hustle harder</span>
                            <span class="hero-cycler-item">optimize everything</span>
                        </span>
                    </span>
                    <span class="hero-line hero-staccato">The <span class="hero-staccato-accent">anti-discipline</span> OS</span>
                    <span class="hero-line hero-subline">Your mind. Your phone. Your momentum.</span>
                </h1>

                <div class="hero-alpha" id="join-alpha">
                    <form class="signup-form">
                        <div class="form-row pill-form">
                            <input type="email" class="signup-input" placeholder="Email" required autocomplete="email">
                            <button type="submit" class="signup-btn">
                                <span class="btn-text">Join Alpha</span>
                                <span class="btn-spinner"></span>
                            </button>
                            <div class="signup-success" style="display:none;">
                                <p>Sequence queued. — Rohith</p>
                            </div>
                        </div>
                        <p class="signup-error" style="display:none; margin-top: 1rem;"></p>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <footer class="container">
        <div class="footer-left" style="display: flex; gap: 2rem; align-items: center;">
            <span class="logo">SAVYN_LABS</span>
            <span class="copy">&copy; 2026</span>
        </div>
        <div class="footer-right" style="display: flex; gap: 1.5rem; align-items: center;">
            <a href="/architecture/">Architecture</a>
            <a href="/privacy/">Privacy</a>
            <a href="mailto:support@savynlabs.com">Comms</a>
        </div>
    </footer>

    <script src="script.js"></script>
</body>

</html>
